[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1440x900x24 +extension GLX +render -noreset
priority=10
autorestart=true
[program:openbox]
command=/bin/bash -c "sleep 2; exec openbox"
priority=20
autorestart=true
[program:vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900
priority=30
autorestart=true
startretries=20
[program:web]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=40
autorestart=true
[program:robot]
command=/etc/classroom/entrypoint.sh ros2 launch ros2_classroom display.launch.py
priority=50
autorestart=true
stdout_logfile=/tmp/robot.log
stderr_logfile=/tmp/robot-error.log
[program:rviz]
command=/bin/bash -c "sleep 5; exec /etc/classroom/entrypoint.sh ros2 run rviz2 rviz2 -d /opt/ros2_ws/install/ros2_classroom/share/ros2_classroom/config/classroom.rviz"
priority=60
autorestart=true
stdout_logfile=/tmp/rviz.log
stderr_logfile=/tmp/rviz-error.log
