; Starts the browser desktop (Xvfb + noVNC) and the robot display (launch file + RViz).
; Every program inherits the sourced ROS environment from the Dockerfile CMD.
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1440x900x24 +extension GLX +render -noreset
priority=10
autorestart=true

[program:openbox]
command=bash -c "sleep 2; exec openbox"
priority=20
autorestart=true

[program:vnc]
command=x11vnc -display :1 -forever -shared -nopw -localhost -rfbport 5900
priority=30
autorestart=true
startretries=20

[program:web]
command=websockify --web=/usr/share/novnc/ 6080 localhost:5900
priority=40
autorestart=true

[program:robot]
command=ros2 launch ros2_classroom display.launch.py
priority=50
autorestart=true
stdout_logfile=/tmp/robot.log
stderr_logfile=/tmp/robot-error.log

[program:rviz]
command=bash -c "sleep 5; exec rviz2 -d /opt/ros2_ws/install/ros2_classroom/share/ros2_classroom/config/classroom.rviz"
priority=60
autorestart=true
stdout_logfile=/tmp/rviz.log
stderr_logfile=/tmp/rviz-error.log
